<section
  id="hero"
  class="relative min-h-screen flex items-center overflow-hidden"
>
  <canvas #heroCanvas class="absolute inset-0 w-full h-full -z-10"></canvas>

  <div class="container mx-auto px-6 lg:px-12 py-20 flex flex-col items-center">
    <div class="hero-content z-10 max-w-3xl w-full text-center">
      <!-- Monogram / Logo -->
      <div class="hero-monogram mb-6 opacity-0 flex justify-center">
        <img
          [src]="
            isDark() ? 'assets/icons/logo-dark.svg' : 'assets/icons/logo.svg'
          "
          alt="Logo Daniel Castañeda"
          class="w-20 h-20 md:w-24 md:h-24"
        />
      </div>

      <!-- Name -->
      <h1 class="hero-name font-display font-bold text-text-primary mb-2">
        <span
          class="block text-4xl md:text-5xl lg:text-6xl glitch-text"
          data-text="DANIEL ALEJANDRO"
          >DANIEL ALEJANDRO</span
        >
        <span
          class="block text-4xl md:text-5xl lg:text-6xl text-accent-cyan mt-2 glitch-text"
          data-text="CASTAÑEDA SUÁREZ"
          >CASTAÑEDA SUÁREZ</span
        >
      </h1>

      <!-- Typewriter Role -->
      <div class="hero-role mt-6 flex items-center justify-center gap-3">
        <span class="w-8 h-[2px] bg-accent-cyan"></span>
        <span #roleText class="font-code text-lg text-text-secondary"></span>
        <span class="w-2 h-5 bg-accent-cyan animate-pulse-glow"></span>
      </div>

      <!-- Tech Stack Chips -->
      <div class="hero-stack flex flex-wrap justify-center gap-2 mt-8">
        @for (tech of techStack; track tech) {
          <span
            class="chip px-3 py-1.5 bg-bg-card border border-bg-border rounded-full text-text-code text-sm font-code hover:border-accent-cyan/50 transition-colors"
          >
            {{ tech }}
          </span>
        }
      </div>

      <!-- CTAs -->
      <div class="hero-cta flex flex-wrap justify-center gap-4 mt-10">
        <button
          (click)="scrollToProjects()"
          class="px-8 py-3 bg-accent-cyan text-bg-primary font-display font-bold rounded-lg hover:shadow-lg hover:shadow-accent-cyan/25 transition-all duration-300 hover:-translate-y-0.5"
        >
          Ver Proyectos
        </button>
        <a
          href="assets/cv-daniel-casta%C3%B1eda.pdf"
          download="CV-Daniel-Castaneda.pdf"
          class="px-8 py-3 border border-accent-cyan text-accent-cyan font-display font-bold rounded-lg hover:bg-accent-cyan/10 transition-all duration-300 hover:-translate-y-0.5"
        >
          Descargar CV
        </a>
      </div>

      <!-- Social Links -->
      <div class="hero-socials flex justify-center gap-4 mt-8">
        <a
          href="https://github.com/Shiva0616"
          target="_blank"
          rel="noopener noreferrer"
          appMagnetic
          class="p-2 text-text-secondary hover:text-accent-cyan transition-colors"
          aria-label="GitHub"
        >
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
            />
          </svg>
        </a>
        <a
          href="https://www.linkedin.com/in/daniel-alejandro-casta%C3%B1eda-su%C3%A1rez-165197211/"
          target="_blank"
          rel="noopener noreferrer"
          appMagnetic
          class="p-2 text-text-secondary hover:text-accent-cyan transition-colors"
          aria-label="LinkedIn"
        >
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
            />
          </svg>
        </a>
      </div>
    </div>
  </div>
</section>
