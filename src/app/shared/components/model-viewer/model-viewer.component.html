<div
  class="model-viewer-container relative w-full h-full min-h-[200px] rounded-xl overflow-hidden bg-bg-secondary"
  [attr.aria-label]="config().alt"
>
  <!-- 3D Canvas -->
  <canvas
    #viewerCanvas
    class="w-full h-full block"
  ></canvas>

  <!-- Loading Overlay -->
  @if (isLoading()) {
    <div class="loading-overlay absolute inset-0 flex items-center justify-center bg-bg-secondary z-10">
      <div class="loading-content flex flex-col items-center gap-3">
        <div class="loading-spinner w-10 h-10 rounded-full border-2 border-bg-border border-t-accent-cyan"></div>
        <span class="text-xs font-code text-text-muted">Loading 3D model...</span>
      </div>
    </div>
  }

  <!-- Error State -->
  @if (hasError()) {
    <div class="absolute inset-0 flex items-center justify-center bg-bg-secondary/80 z-10">
      <div class="text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 mx-auto mb-2 text-text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span class="text-xs font-code text-text-muted">3D view unavailable</span>
      </div>
    </div>
  }
</div>
