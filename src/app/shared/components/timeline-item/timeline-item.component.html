<div
  class="timeline-item relative flex items-start"
  [ngClass]="{
    'flex-row-reverse': !isLeft,
    'flex-row': isLeft,
  }"
>
  <!-- Content Card -->
  <div
    class="timeline-card relative w-full md:w-[calc(50%-2rem)] p-5 rounded-xl border border-bg-border bg-bg-card transition-all duration-300 hover:border-accent-cyan/40 hover:shadow-lg"
    [ngClass]="{
      'md:mr-auto': isLeft,
      'md:ml-auto': !isLeft,
    }"
  >
    <!-- Date Badge -->
    <div class="flex items-center gap-2 mb-3">
      <span
        class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-code font-semibold uppercase tracking-wider"
        [style.background]="typeColor + '18'"
        [style.color]="typeColor"
      >
        @if (item().type === "education") {
          <!-- Graduation Cap Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-3 h-3 mr-1"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
            <path d="M6 12v5c3 3 9 3 12 0v-5" />
          </svg>
        } @else {
          <!-- Briefcase Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-3 h-3 mr-1"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
          </svg>
        }
        {{ item().type }}
      </span>
      <span class="font-code text-[11px] text-text-muted">
        {{ item().date }}
      </span>
    </div>

    <!-- Title & Subtitle -->
    <h4
      class="font-display text-base sm:text-lg font-bold text-text-primary mb-1 leading-tight"
    >
      {{ item().title }}
    </h4>
    <p class="font-body text-sm text-accent-cyan mb-3">
      {{ item().subtitle }}
    </p>

    <!-- Description -->
    <p class="font-body text-sm text-text-secondary leading-relaxed mb-3">
      {{ item().description }}
    </p>

    @if (item().link) {
      <div class="mb-3">
        <a
          [href]="item().link"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-bg-border text-xs font-body text-text-secondary hover:text-accent-cyan hover:border-accent-cyan transition-all duration-200"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-3.5 h-3.5"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
            />
          </svg>
          Ver GitHub
        </a>
      </div>
    }

    <!-- Tags -->
    @if (item().tags && item().tags!.length > 0) {
      <div class="flex flex-wrap gap-1.5">
        @for (tag of item().tags; track tag) {
          <span
            class="inline-block px-2 py-0.5 rounded-md bg-bg-secondary border border-bg-border text-[10px] font-code text-text-muted"
          >
            {{ tag }}
          </span>
        }
      </div>
    }

    <!-- Arrow pointer (desktop only) -->
    <div
      class="timeline-arrow hidden md:block absolute top-6 w-3 h-3 border-bg-border bg-bg-card transform rotate-45"
      [ngClass]="{
        '-right-1.5 border-t border-r': isLeft,
        '-left-1.5 border-b border-l': !isLeft,
      }"
    ></div>
  </div>

  <!-- Center Dot (desktop only) -->
  <div
    class="timeline-dot hidden md:flex absolute left-1/2 -translate-x-1/2 top-6 z-10 items-center justify-center w-4 h-4 rounded-full border-2 bg-bg-primary"
    [style.border-color]="typeColor"
  >
    <div class="w-2 h-2 rounded-full" [style.background]="typeColor"></div>
  </div>

  <!-- Mobile Dot -->
  <div
    class="md:hidden absolute left-0 top-6 z-10 flex items-center justify-center w-3 h-3 rounded-full border-2 bg-bg-primary -translate-x-1/2"
    [style.border-color]="typeColor"
  >
    <div class="w-1.5 h-1.5 rounded-full" [style.background]="typeColor"></div>
  </div>
</div>
