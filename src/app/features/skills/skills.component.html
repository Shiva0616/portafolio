<section id="skills" class="relative py-20 md:py-28 bg-bg-primary">
  <div class="container mx-auto px-6 lg:px-12">
    <app-section-title title="Habilidades" subtitle="Stack Tecnológico" />

    <!-- Category Tabs -->
    <div class="flex flex-wrap justify-center gap-2 mb-12" appReveal>
      @for (cat of categories; track cat.id) {
        <button
          (click)="setCategory(cat.id)"
          class="category-tab px-5 py-2.5 rounded-lg font-code text-sm transition-all duration-300 border"
          [class]="
            activeCategory() === cat.id
              ? 'bg-accent-cyan text-bg-primary border-accent-cyan shadow-lg font-bold'
              : 'bg-bg-card text-text-secondary border-bg-border hover:text-text-primary'
          "
        >
          {{ cat.label }}
        </button>
      }
    </div>

    <!-- Skills Grid -->
    <div
      class="skills-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"
    >
      @for (skill of filteredSkills(); track skill.name) {
        <div appReveal [appRevealDelay]="$index * 0.05">
          <app-skill-card [skill]="skill" />
        </div>
      }
    </div>
  </div>
</section>
