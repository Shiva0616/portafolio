<section id="experience" class="relative py-20 md:py-28 bg-bg-primary">
  <div class="container mx-auto px-6 lg:px-12">
    <app-section-title
      title="Experiencia"
      subtitle="Trayectoria Profesional"
    />

    <div class="timeline-container mt-16">
      <div class="absolute left-1/2 top-0 bottom-0 w-[1px] bg-bg-border hidden md:block"></div>
      @for (item of workItems(); track item.id; let i = $index) {
        <app-timeline-item
          [item]="item"
          [index]="i"
          [side]="i % 2 === 0 ? 'left' : 'right'"
        />
      }

      @if (workItems().length === 0) {
        <div class="text-center text-text-muted py-12" appReveal>
          <p class="font-code text-sm">Cargando experiencia...</p>
        </div>
      }
    </div>
  </div>
</section>
