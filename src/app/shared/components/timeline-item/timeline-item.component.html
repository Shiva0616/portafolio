<div
  class="timeline-item relative flex items-start"
  [ngClass]="{
    'flex-row-reverse': !isLeft,
    'flex-row': isLeft
  }"
>
  <!-- Content Card -->
  <div
    class="timeline-card relative w-full md:w-[calc(50%-2rem)] p-5 rounded-xl border border-bg-border bg-bg-card transition-all duration-300 hover:border-accent-cyan/40 hover:shadow-lg"
    [ngClass]="{
      'md:mr-auto': isLeft,
      'md:ml-auto': !isLeft
    }"
  >
    <!-- Date Badge -->
    <div class="flex items-center gap-2 mb-3">
      <span
        class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-code font-semibold uppercase tracking-wider"
        [style.background]="typeColor + '18'"
        [style.color]="typeColor"
      >
        @if (item().type === 'education') {
          <!-- Graduation Cap Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        } @else {
          <!-- Briefcase Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
        }
        {{ item().type }}
      </span>
      <span class="font-code text-[11px] text-text-muted">
        {{ item().date }}
      </span>
    </div>

    <!-- Title & Subtitle -->
    <h4 class="font-display text-base sm:text-lg font-bold text-text-primary mb-1 leading-tight">
      {{ item().title }}
    </h4>
    <p class="font-body text-sm text-accent-cyan mb-3">
      {{ item().subtitle }}
    </p>

    <!-- Description -->
    <p class="font-body text-sm text-text-secondary leading-relaxed mb-3">
      {{ item().description }}
    </p>

    <!-- Tags -->
    @if (item().tags && item().tags!.length > 0) {
      <div class="flex flex-wrap gap-1.5">
        @for (tag of item().tags; track tag) {
          <span class="inline-block px-2 py-0.5 rounded-md bg-bg-secondary border border-bg-border text-[10px] font-code text-text-muted">
            {{ tag }}
          </span>
        }
      </div>
    }

    <!-- Arrow pointer (desktop only) -->
    <div
      class="timeline-arrow hidden md:block absolute top-6 w-3 h-3 border-bg-border bg-bg-card transform rotate-45"
      [ngClass]="{
        '-right-1.5 border-t border-r': isLeft,
        '-left-1.5 border-b border-l': !isLeft
      }"
    ></div>
  </div>

  <!-- Center Dot (desktop only) -->
  <div class="timeline-dot hidden md:flex absolute left-1/2 -translate-x-1/2 top-6 z-10 items-center justify-center w-4 h-4 rounded-full border-2 bg-bg-primary"
    [style.border-color]="typeColor"
  >
    <div class="w-2 h-2 rounded-full" [style.background]="typeColor"></div>
  </div>

  <!-- Mobile Dot -->
  <div class="md:hidden absolute left-0 top-6 z-10 flex items-center justify-center w-3 h-3 rounded-full border-2 bg-bg-primary -translate-x-1/2"
    [style.border-color]="typeColor"
  >
    <div class="w-1.5 h-1.5 rounded-full" [style.background]="typeColor"></div>
  </div>
</div>
